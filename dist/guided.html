<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:*; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Prompt Maker — الاكتشاف الموجَّه / Guided Discovery</title>
<style>
:root{--bg:#f6f7f9;--fg:#14181f;--mut:#4b5563;--card:#fff;--bd:#c9ced6;--pri:#0b5cad;--priTx:#fff;--ok:#0a6b35;--warn:#8a5300;--bad:#a4161a;--focus:#ff9f1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Segoe UI",Tahoma,Arial,sans-serif}
a.skip{position:absolute;inset-inline-start:8px;top:-60px;background:#000;color:#fff;padding:8px 12px;z-index:10}
a.skip:focus{top:8px}
header,main,footer{max-width:1100px;margin:0 auto;padding:12px 16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:1.25rem;margin:0}
h2{font-size:1.1rem;margin:0 0 8px}
button,select,input,textarea{font:inherit;color:inherit}
button{min-height:44px;min-width:44px;padding:8px 14px;border:1px solid var(--bd);border-radius:8px;background:#fff;cursor:pointer}
button.primary{background:var(--pri);color:var(--priTx);border-color:var(--pri)}
button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input[type=text],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;min-height:44px}
textarea{min-height:96px;resize:vertical}
label{display:block;font-weight:600;margin:8px 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.banner{border:1px solid var(--warn);background:#fff7e6;color:#4a2c00;border-radius:10px;padding:10px 12px;margin:8px 0}
.banner.ok{border-color:var(--ok);background:#eaf7ef;color:#07391c}
.banner.bad{border-color:var(--bad);background:#fdecec;color:#5c0b0d}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:260px 1fr;gap:14px}
nav.items ul{list-style:none;margin:0;padding:0}
nav.items button{width:100%;text-align:start;display:flex;justify-content:space-between;gap:6px}
nav.items button[aria-current=true]{border-color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--bd);font-size:.8rem;white-space:nowrap}
.chip.res{border-color:var(--ok);color:var(--ok)}.chip.open{border-color:var(--warn);color:var(--warn)}.chip.bad{border-color:var(--bad);color:var(--bad)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tabs button[aria-selected=true]{background:var(--pri);color:var(--priTx);border-color:var(--pri)}
.shown{border-inline-start:4px solid var(--pri);background:#eef4fb;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:6px}
.err{color:var(--bad);font-weight:600;margin:4px 0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:.85rem;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{border:1px solid var(--bd);padding:4px 6px;text-align:start;vertical-align:top;overflow-wrap:anywhere}
.scroll{overflow-x:auto}
.hidden{display:none!important}
@media (max-width:700px){.grid{grid-template-columns:1fr}header,main,footer{padding:10px 16px}}
</style>
</head>
<body>
<a class="skip" href="#main" id="skip"></a>
<header>
  <h1 id="appTitle"></h1>
  <div class="row">
    <button id="btnLang" type="button"></button>
    <span id="modeLabel"></span>
    <div role="radiogroup" aria-labelledby="modeLabel" class="row" id="modeGroup"></div>
  </div>
</header>
<main id="main" tabindex="-1">
  <div id="live" role="status" aria-live="polite" class="banner ok hidden"></div>
  <div id="offlineBanner" class="banner" role="note"></div>
  <div id="storageBanner" class="banner bad hidden" role="alert"></div>
  <div class="card row">
    <div style="flex:1;min-width:220px"><label for="projSelect" id="lblProj"></label><select id="projSelect"></select></div>
    <button id="btnNewProj" type="button"></button>
    <div id="progress" aria-live="off"></div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section id="panelQuestions" role="tabpanel"></section>
  <section id="panelLedger" role="tabpanel" class="hidden"></section>
  <section id="panelPackage" role="tabpanel" class="hidden"></section>
  <section id="panelConnect" role="tabpanel" class="hidden"></section>
</main>
<footer><small id="footNote"></small></footer>

<script src="core_bundle.js"></script>
<script src="gfpi_bundle.js"></script>

}

function renderLedger() {

}
function compileCtx() { return { ledger: S.ledger, project_id: S.id, created_at: now(), producer: { name: 'prompt-maker', commit: 'ui' }, compileProject: PMC.compileProject }; }

  if (!b.ok) { announce(b.error, true); return; }
  S.packages.push({ built: { package: b.package, documents: b.documents, package_sha256: b.package_sha256 }, approval: null }); persist(); announce(t('pkgMade')); render();
}
function approveForm(entry, cs) {

      clear(out); var A = snapshotOf(S.packages[+sa.value]); var B = snapshotOf(S.packages[+sb.value]); var any = false;
      Object.keys(B).forEach(function (k) { if (JSON.stringify(A[k] && A[k].value) !== JSON.stringify(B[k].value) || (A[k] && A[k].state) !== B[k].state) { any = true; out.appendChild(h('div', { class: 'card', 'data-changed': k }, [h('strong', { text: t('changed') + ': ' + lbl(D.CATALOG_BY_ID[k].label) }), h('div', { class: 'mono', text: '− ' + (A[k] && A[k].value !== null ? displayValue(A[k].value) : '∅') + ' [' + (A[k] && A[k].state) + ']' }), h('div', { class: 'mono', text: '+ ' + (B[k].value !== null ? displayValue(B[k].value) : '∅') + ' [' + B[k].state + ']' })])); } });
      if (!any) out.appendChild(h('p', { id: 'cmp-none', text: t('noChange') }));

  p.appendChild(h('h2', { text: t('connTitle') }));

  p.appendChild(h('label', { for: 'inp-comp-code', text: t('connCode') })); p.appendChild(h('input', { type: 'text', id: 'inp-comp-code', autocomplete: 'off', maxlength: 32 }));
  p.appendChild(h('div', { class: 'row' }, [
    h('button', { type: 'button', class: 'primary', id: 'btn-pair', text: t('pair'), onclick: pair }),
    h('button', { type: 'button', id: 'btn-revoke', disabled: !companion.token, text: t('revoke'), onclick: function () { call('/v1/session', 'DELETE').finally(function () { companion.token = null; companion.providers = []; render(); }); } })]));

}
function pair() {

  fetch(companion.base + '/v1/pair', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code: code }), cache: 'no-store' })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (r) { if (!r.ok) { announce(t('pairFail', { e: r.j.error || '?' }), true); return; } companion.token = r.j.token; return call('/v1/status', 'GET').then(function (s) { companion.providers = (s.json && s.json.providers) || []; announce(t('paired')); render(); }); })
    .catch(function () { announce(t('pairFail', { e: 'NETWORK' }), true); });
}
